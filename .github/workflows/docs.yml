name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Lint docs
        run: docpilot lint docs --quiet
      - name: Check links
        run: docpilot links docs
      - name: Evaluate docs chatbot retrieval
        run: docpilot eval --min-hit 0.8
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: gap-report
          path: reports/gap-report.md

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
